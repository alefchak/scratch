---
# Rotate the root password on each host and store it in AWS Secrets Manager,
# using only Ansible modules and lookups (no AWS CLI).
#
# Order per host:
#   1. Save the current /etc/shadow hash and the current secret value
#   2. Generate a new password and hash it once
#   3. Write it to Secrets Manager and read it back. It becomes AWSCURRENT;
#      AWS keeps the old value as AWSPREVIOUS.
#   4. Set the new hash on the host and verify /etc/shadow
#   On any failure: restore the old hash on the host and write the old password
#   back to the secret, so both stay on the old password.
#
# The AWS modules can't set staging labels, so unlike an AWSPENDING-based flow
# the secret holds the new password a few seconds before the host does.
#
# Controller requirements: amazon.aws, community.aws and community.general
# collections; boto3/botocore; passlib (for password_hash).
# AWS credentials and region via environment or profile.
# Connect with an SSH key + sudo, NOT the root password.

- name: Rotate root password
  hosts: linux_servers
  become: true
  serial:
    - 1          # canary
    - 5
    - "20%"
  max_fail_percentage: 0
  gather_facts: false

  vars:
    secret_id: "root/{{ inventory_hostname }}"   # one secret per host, plain string value
    # The module sets the secret's description on every write; keep this
    # matching what you want, or it will replace the existing one.
    secret_description: "root password for {{ inventory_hostname }}"
    max_class_repeat: 3

  tasks:
    - name: Rotate with rollback
      block:
        # ---------- 1. Capture current state ----------
        - name: Read current root shadow entry
          ansible.builtin.command: getent shadow root
          register: old_shadow
          changed_when: false
          no_log: true

        - name: Save current hash and current secret value for rollback
          ansible.builtin.set_fact:
            old_hash: "{{ old_shadow.stdout.split(':')[1] }}"
            old_pw: "{{ lookup('amazon.aws.secretsmanager_secret', secret_id) }}"
          no_log: true

        - name: Check the secret exists and has a value
          ansible.builtin.assert:
            that:
              - old_pw | length > 0
            fail_msg: "Secret {{ secret_id }} is missing or empty; not rotating this host."
            quiet: true
          no_log: true

        # ---------- 2. Generate ----------
        - name: Generate compliant password
          ansible.builtin.set_fact:
            new_pw: >-
              {{ lookup('community.general.random_string',
                        length=20,
                        min_lower=2, min_upper=2,
                        min_numeric=2, min_special=2,
                        override_special='!@#%^*-_=+') }}
          register: pw_gen
          until: >-
            pw_gen.ansible_facts.new_pw is not
            search('[a-z]{' ~ (max_class_repeat + 1) ~ '}|[A-Z]{' ~ (max_class_repeat + 1) ~
                   '}|[0-9]{' ~ (max_class_repeat + 1) ~ '}|[^A-Za-z0-9]{' ~ (max_class_repeat + 1) ~ '}')
          retries: 50
          delay: 0
          delegate_to: localhost
          become: false
          no_log: true

        - name: Hash once so the same hash is written and verified
          ansible.builtin.set_fact:
            new_hash: "{{ new_pw | password_hash('sha512') }}"
          no_log: true

        # ---------- 3. Store in Secrets Manager ----------
        - name: Write new password to Secrets Manager
          community.aws.secretsmanager_secret:
            name: "{{ secret_id }}"
            secret: "{{ new_pw }}"
            secret_type: string
            description: "{{ secret_description }}"
            overwrite: true
            state: present
          delegate_to: localhost
          become: false
          register: secret_write
          no_log: true

        - name: Note that the secret now holds the new password
          ansible.builtin.set_fact:
            secret_written: "{{ secret_write.changed }}"

        - name: Read back AWSCURRENT and compare
          ansible.builtin.assert:
            that:
              - lookup('amazon.aws.secretsmanager_secret', secret_id) == new_pw
            quiet: true
          delegate_to: localhost
          become: false
          no_log: true

        # ---------- 4. Change host ----------
        - name: Set new root password
          ansible.builtin.user:
            name: root
            password: "{{ new_hash }}"
            update_password: always
          register: pw_changed
          no_log: true

        - name: Read new root shadow entry
          ansible.builtin.command: getent shadow root
          register: new_shadow
          changed_when: false
          no_log: true

        - name: Verify host has the new hash
          ansible.builtin.assert:
            that:
              - new_shadow.stdout.split(':')[1] == new_hash
            quiet: true
          no_log: true

      rescue:
        - name: Restore old hash on host
          ansible.builtin.user:
            name: root
            password: "{{ old_hash }}"
            update_password: always
          when: old_hash is defined and (pw_changed is changed)
          no_log: true

        - name: Write old password back to Secrets Manager
          community.aws.secretsmanager_secret:
            name: "{{ secret_id }}"
            secret: "{{ old_pw }}"
            secret_type: string
            description: "{{ secret_description }}"
            overwrite: true
            state: present
          delegate_to: localhost
          become: false
          when: secret_written | default(false) | bool
          no_log: true

        - name: Stop this host
          ansible.builtin.fail:
            msg: >-
              Rotation failed on {{ inventory_hostname }}; host and secret were set back
              to the old password. If restoring the secret also failed, the old
              password is in the secret's AWSPREVIOUS version.
