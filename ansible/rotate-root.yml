---
# Rotate the root password on each host and store it in AWS Secrets Manager,
# using AWSPENDING so AWSCURRENT only moves once the host is confirmed.
#
# Order per host:
#   1. Save the current /etc/shadow hash (so rollback never depends on the old plaintext)
#   2. Generate a new password and hash it once
#   3. Write it to Secrets Manager as AWSPENDING (AWSCURRENT is untouched) and read it back
#   4. Set the new hash on the host and verify /etc/shadow
#   5. Promote AWSPENDING -> AWSCURRENT (AWS moves the old version to AWSPREVIOUS)
#   On any failure: clear AWSPENDING and, unless the new version already became
#   AWSCURRENT, restore the old hash on the host.
#
# AWS calls go through library/secretsmanager_stage.py, a small module in this
# repo, because no published module can set staging labels.
#
# Controller requirements: amazon.aws (>= 7) and community.general collections,
# boto3/botocore, passlib (for password_hash). AWS credentials and region via
# environment or profile. Connect with an SSH key + sudo, NOT the root password.

- name: Rotate root password
  hosts: linux_servers
  become: true
  serial:
    - 1          # canary
    - 5
    - "20%"
  max_fail_percentage: 0
  gather_facts: false

  vars:
    secret_id: "root/{{ inventory_hostname }}"   # one secret per host, plain string value
    max_class_repeat: 3

  tasks:
    - name: Rotate with rollback
      block:
        # ---------- 1. Capture current state ----------
        - name: Read current root shadow entry
          ansible.builtin.command: getent shadow root
          register: old_shadow
          changed_when: false
          no_log: true

        - name: Save current hash for rollback
          ansible.builtin.set_fact:
            old_hash: "{{ old_shadow.stdout.split(':')[1] }}"
          no_log: true

        # ---------- 2. Generate ----------
        - name: Generate compliant password
          ansible.builtin.set_fact:
            new_pw: >-
              {{ lookup('community.general.random_string',
                        length=20,
                        min_lower=2, min_upper=2,
                        min_numeric=2, min_special=2,
                        override_special='!@#%^*-_=+') }}
          register: pw_gen
          until: >-
            pw_gen.ansible_facts.new_pw is not
            search('[a-z]{' ~ (max_class_repeat + 1) ~ '}|[A-Z]{' ~ (max_class_repeat + 1) ~
                   '}|[0-9]{' ~ (max_class_repeat + 1) ~ '}|[^A-Za-z0-9]{' ~ (max_class_repeat + 1) ~ '}')
          retries: 50
          delay: 0
          delegate_to: localhost
          become: false
          no_log: true

        - name: Hash once so the same hash is written and verified
          ansible.builtin.set_fact:
            new_hash: "{{ new_pw | password_hash('sha512') }}"
          no_log: true

        # ---------- 3. Stage in Secrets Manager ----------
        - name: Write new password as AWSPENDING
          secretsmanager_stage:
            secret_id: "{{ secret_id }}"
            action: put_pending
            secret_string: "{{ new_pw }}"
          delegate_to: localhost
          become: false
          register: staged
          no_log: true

        - name: Record pending version id
          ansible.builtin.set_fact:
            new_version_id: "{{ staged.version_id }}"

        - name: Read back AWSPENDING and compare
          ansible.builtin.assert:
            that:
              - lookup('amazon.aws.secretsmanager_secret', secret_id, version_stage='AWSPENDING') == new_pw
            quiet: true
          delegate_to: localhost
          become: false
          no_log: true

        # ---------- 4. Change host ----------
        - name: Set new root password
          ansible.builtin.user:
            name: root
            password: "{{ new_hash }}"
            update_password: always
          register: pw_changed
          no_log: true

        - name: Note whether the host password changed
          ansible.builtin.set_fact:
            host_changed: "{{ pw_changed.changed }}"

        - name: Read new root shadow entry
          ansible.builtin.command: getent shadow root
          register: new_shadow
          changed_when: false
          no_log: true

        - name: Verify host has the new hash
          ansible.builtin.assert:
            that:
              - new_shadow.stdout.split(':')[1] == new_hash
            quiet: true
          no_log: true

        # ---------- 5. Promote ----------
        - name: Promote new version to AWSCURRENT
          secretsmanager_stage:
            secret_id: "{{ secret_id }}"
            action: promote
            version_id: "{{ new_version_id }}"
          delegate_to: localhost
          become: false
          register: promoted

        - name: Log the version ids (no secret values)
          ansible.builtin.debug:
            msg: "{{ secret_id }}: AWSCURRENT {{ new_version_id }}, AWSPREVIOUS {{ promoted.previous_version_id }}"

      rescue:
        # Check the secret first: if the new version is already AWSCURRENT
        # (for example, the promote call succeeded but its response was lost),
        # the host must keep the new password.
        - name: Clear AWSPENDING and check which version is current
          secretsmanager_stage:
            secret_id: "{{ secret_id }}"
            action: clear_pending
            version_id: "{{ new_version_id }}"
          delegate_to: localhost
          become: false
          register: cleared
          when: new_version_id is defined
          ignore_errors: true

        - name: Restore old hash on host
          ansible.builtin.user:
            name: root
            password: "{{ old_hash }}"
            update_password: always
          when:
            - old_hash is defined
            - host_changed | default(false) | bool
            - not (cleared.is_current | default(false))
          no_log: true

        - name: Stop this host
          ansible.builtin.fail:
            msg: >-
              Rotation failed on {{ inventory_hostname }}.
              {{ 'The new password was already AWSCURRENT, so the host keeps it.'
                 if (cleared.is_current | default(false))
                 else 'The host and AWSCURRENT were left on the old password.' }}
              Staged version: {{ new_version_id | default('none') }}.
