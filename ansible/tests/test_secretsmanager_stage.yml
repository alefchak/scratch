---
# Exercises library/secretsmanager_stage.py against a local moto server.
# Run from ansible/: ANSIBLE_LIBRARY=library ansible-playbook tests/test_secretsmanager_stage.yml
- name: Test secretsmanager_stage
  hosts: localhost
  gather_facts: false
  vars:
    aws: &aws
      endpoint_url: http://127.0.0.1:5000
      region: us-east-1
      access_key: test
      secret_key: test
    sid: root/test-host

  tasks:
    - name: Stage a pending version
      secretsmanager_stage:
        <<: *aws
        secret_id: "{{ sid }}"
        action: put_pending
        secret_string: new-password
      register: staged

    - name: Check staging left AWSCURRENT alone
      ansible.builtin.assert:
        that:
          - staged is changed
          - not staged.is_current
          - staged.version_ids_to_stages[staged.version_id] == ['AWSPENDING']
          - lookup('amazon.aws.secretsmanager_secret', sid, endpoint_url=aws.endpoint_url,
              region=aws.region, access_key='test', secret_key='test') == 'old-password'
          - lookup('amazon.aws.secretsmanager_secret', sid, version_stage='AWSPENDING',
              endpoint_url=aws.endpoint_url, region=aws.region, access_key='test',
              secret_key='test') == 'new-password'

    - name: Clear pending without promoting
      secretsmanager_stage:
        <<: *aws
        secret_id: "{{ sid }}"
        action: clear_pending
        version_id: "{{ staged.version_id }}"
      register: cleared

    - name: Check clear removed the label and reports not current
      ansible.builtin.assert:
        that:
          - cleared is changed
          - not cleared.is_current
          - "'AWSPENDING' not in (cleared.version_ids_to_stages[staged.version_id] | default([]))"

    - name: Stage again
      secretsmanager_stage:
        <<: *aws
        secret_id: "{{ sid }}"
        action: put_pending
        secret_string: new-password-2
      register: staged2

    - name: Promote
      secretsmanager_stage:
        <<: *aws
        secret_id: "{{ sid }}"
        action: promote
        version_id: "{{ staged2.version_id }}"
      register: promoted

    - name: Check promote moved AWSCURRENT and kept the old one as AWSPREVIOUS
      ansible.builtin.assert:
        that:
          - promoted is changed
          - promoted.is_current
          - promoted.version_ids_to_stages[staged2.version_id] == ['AWSCURRENT']
          - "'AWSPREVIOUS' in promoted.version_ids_to_stages[promoted.previous_version_id]"
          # Name the stage explicitly: moto doesn't move its default version when
          # labels move, while real AWS always defaults to AWSCURRENT.
          - lookup('amazon.aws.secretsmanager_secret', sid, version_stage='AWSCURRENT',
              endpoint_url=aws.endpoint_url, region=aws.region, access_key='test',
              secret_key='test') == 'new-password-2'
          - lookup('amazon.aws.secretsmanager_secret', sid, version_stage='AWSPREVIOUS',
              endpoint_url=aws.endpoint_url, region=aws.region, access_key='test',
              secret_key='test') == 'old-password'

    - name: Promote again is a no-op
      secretsmanager_stage:
        <<: *aws
        secret_id: "{{ sid }}"
        action: promote
        version_id: "{{ staged2.version_id }}"
      register: promoted_again

    - name: Check idempotence and that clear_pending reports a current version
      ansible.builtin.assert:
        that:
          - promoted_again is not changed
          - promoted_again.is_current
